<style>
/* Layout: one phone-width column. Warm kitchen palette (chili red, saffron, dark roast brown) with line-drawn
   kitchen doodles (spoon, fork, tagine, chili, lemon, olive) as the recurring motif. No green anywhere. */
:root{
  --bg:#FFF4E4;
  --surface:#FFFFFF;
  --ink:#2B1710;
  --muted:#7C6256;
  --line:#F1DEC6;
  --chili:#D9381E;
  --on-chili:#FFFFFF;
  --chili-soft:#FFE2D6;
  --saf:#F4A81D;
  --on-saf:#2B1710;
  --saf-soft:#FFEBBD;
  --roast:#3A1F16;
  --st-new:#F4A81D;
  --st-cook:#E4590F;
  --st-out:#2E6FD8;
  --st-done:#7B3F8C;
  --ov:rgba(30,12,6,.55);
  --font-display:'Baloo Bhaijaan 2','Tajawal',Tahoma,sans-serif;
  --font-body:'Tajawal',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1210;--surface:#2B1B16;--ink:#FDEFE0;--muted:#C9AE9E;--line:#45302A;
    --chili:#FF6B4A;--on-chili:#2A0E06;--chili-soft:#4C2118;--saf:#FFC247;--saf-soft:#4B3813;
    --roast:#120907;--ov:rgba(0,0,0,.68);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1210;--surface:#2B1B16;--ink:#FDEFE0;--muted:#C9AE9E;--line:#45302A;
  --chili:#FF6B4A;--on-chili:#2A0E06;--chili-soft:#4C2118;--saf:#FFC247;--saf-soft:#4B3813;
  --roast:#120907;--ov:rgba(0,0,0,.68);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
#root{max-width:560px;margin:0 auto;min-height:100vh}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3;font-weight:700}
h2{font-size:1.3rem}h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
svg.ic{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.fill{fill:currentColor}

/* header */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;margin-inline-end:auto;min-width:0}
.logo svg{width:40px;height:40px;flex:none;display:block}
.wm{font-family:var(--font-display);font-weight:800;font-size:1.55rem;color:var(--chili);letter-spacing:.01em;direction:ltr;line-height:1}
.wm small{display:block;font-family:var(--font-body);font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:0;direction:rtl;margin-top:2px}
.city{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.city select{border:0;background:transparent;appearance:none;-webkit-appearance:none;font-weight:700;padding:0 2px;min-width:0;max-width:30vw}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;flex:none}

.page{padding-block:16px 150px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--chili);color:var(--on-chili);min-height:48px;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.btn.blue{background:var(--st-out);color:#fff}
.btn.violet{background:var(--st-done);color:#fff}
.btn.big{min-height:64px;font-size:1.2rem;border-radius:18px;width:100%}

.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

.dish .body{display:flex;flex-direction:column;gap:6px;min-width:0}

.tag{display:inline-block;background:var(--saf);color:var(--on-saf);font-family:var(--font-display);font-weight:800;font-size:.85rem;padding:0 10px;border-radius:8px;transform:rotate(-3deg);line-height:1.6}

/* search and categories */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;min-height:50px}
.search input{border:0;background:transparent;flex:1;min-width:0;outline:none;min-height:46px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.cat[aria-pressed="true"]{background:var(--roast);border-color:var(--roast);color:#FFF4E4}

/* banners */
.banners{position:relative}
.banner{position:relative;overflow:hidden;border-radius:22px;padding:18px 18px 22px;min-height:164px;display:flex;flex-direction:column;justify-content:center;gap:6px;width:100%;border:0;text-align:start;cursor:pointer}
.banner h2{font-size:1.65rem;line-height:1.25;max-width:78%}
.banner p{font-weight:700;max-width:78%}
.banner .tag{align-self:flex-start;margin-bottom:4px}
.banner .dd{position:absolute;inset:0;width:100%;height:100%;opacity:.2;pointer-events:none}
.banner .big-art{position:absolute;inset-inline-end:-14px;bottom:-14px;width:46%;max-width:190px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:5px solid rgba(255,255,255,.55)}
.banner .big-art svg{width:100%;height:100%;display:block}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button[aria-current="true"]{background:var(--chili);width:24px;border-radius:6px}

/* sheet / modal */
.ov{position:fixed;inset:0;background:var(--ov);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov.mid{align-items:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:14px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet.center{border-radius:24px;margin:16px;width:auto}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);align-self:center;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* bottom nav + floating cart bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.tab{position:relative;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;color:var(--muted);cursor:pointer;font-weight:700;font-size:.82rem}
.tab svg.ic{width:1.5em;height:1.5em}
.tab[aria-current="page"]{color:var(--chili);background:var(--chili-soft)}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--chili);color:var(--on-chili);border-radius:999px;min-width:20px;height:20px;font-size:.75rem;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;left:0;right:0;z-index:24;bottom:calc(74px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.fab .btn{max-width:528px;margin:0 auto;width:100%;justify-content:space-between;pointer-events:auto;box-shadow:0 8px 24px rgba(60,20,8,.28);min-height:56px;border-radius:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--roast);color:#FFF4E4;padding:10px 16px;border-radius:12px;z-index:60;font-weight:700;max-width:90vw}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-weight:800;font-size:.92rem}
.inp{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px;min-height:50px}
.inp.ltr{direction:ltr;text-align:left;letter-spacing:.05em}
textarea.inp{min-height:84px;resize:vertical}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;background:var(--surface);min-height:50px;text-align:start;width:100%}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--chili);background:var(--chili-soft)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.opt.sq .dot{border-radius:7px}
.opt[aria-pressed="true"] .dot,.opt[aria-checked="true"] .dot{background:var(--chili);border-color:var(--chili);color:var(--on-chili)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:42px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.stepper b{min-width:28px;text-align:center}

/* welcome */
.welcome{padding-block:max(16px,env(safe-area-inset-top,0px)) 40px;display:flex;flex-direction:column;gap:22px}
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--chili);color:var(--on-chili);padding:28px 22px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.hero .dd{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none;color:#FFE9B0}
.hero .logo-big{width:112px;height:112px;position:relative;filter:drop-shadow(0 8px 14px rgba(60,20,8,.3))}
.hero .wm-big{font-family:var(--font-display);font-weight:800;font-size:3.3rem;line-height:1;direction:ltr;position:relative;color:#FFF4E4}
.hero .ar{font-family:var(--font-display);font-size:1.25rem;position:relative}
.hero .sticker{position:relative;transform:rotate(-4deg);margin-top:6px}
.role{display:flex;align-items:center;gap:14px;text-align:start;border:2px solid var(--line);background:var(--surface);border-radius:22px;padding:16px;cursor:pointer;width:100%}
.role:hover{border-color:var(--chili)}
.role .ico{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--chili);color:var(--on-chili);flex:none}
.role.cook .ico{background:var(--saf);color:var(--on-saf)}
.role .ico svg.ic{width:30px;height:30px}
.role b{font-family:var(--font-display);font-size:1.2rem;display:block}

/* orders */
.status{display:flex;align-items:center;gap:6px;font-weight:800;border-radius:999px;padding:4px 14px;color:#fff;font-size:.9rem;width:fit-content}
.st-new{background:var(--st-new);color:#2B1710}
.st-cooking{background:var(--st-cook)}
.st-out{background:var(--st-out)}
.st-done{background:var(--st-done)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:12px;align-items:center}
.sum{display:flex;flex-direction:column;gap:6px}
.sum .r{display:flex;justify-content:space-between;gap:10px}
.sum .tot{font-weight:800;font-size:1.15rem;border-top:2px dashed var(--line);padding-top:8px}
.note{background:var(--saf-soft);border-radius:14px;padding:10px 12px;font-size:.92rem}
.thread{display:flex;flex-direction:column;gap:8px;border-top:2px dashed var(--line);padding-top:10px}
.msg{display:flex;flex-direction:column;gap:2px}
.msg.mine{align-items:flex-start}
.msg.theirs{align-items:flex-end}
.msg audio{max-width:100%;height:40px}
.filebtn{position:relative;overflow:hidden;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}

.kanban-h i{width:16px;height:16px;border-radius:50%;display:block;flex:none}
.empty{position:relative;overflow:hidden;text-align:center;padding:36px 12px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center;border:2px dashed var(--line);border-radius:22px}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;cursor:pointer;padding:2px;color:var(--line)}
.stars button.on{color:var(--saf)}
.stars svg.ic{width:32px;height:32px}
.reply{background:var(--saf-soft);border-radius:14px;padding:8px 12px;font-size:.92rem}
.photo-prev{width:100%;max-width:220px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:var(--saf-soft);border:2px dashed var(--line);display:grid;place-items:center;color:var(--muted)}
.photo-prev img{width:100%;height:100%;object-fit:cover}

/* chat */
.sheet.chat{height:90vh;padding-bottom:0;gap:0;overflow:hidden}
.chat-h{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.chat-body{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px 0}
.bubble{max-width:82%;padding:8px 12px;border-radius:18px;display:flex;flex-direction:column;gap:2px;overflow-wrap:anywhere}
.bubble.mine{align-self:flex-start;background:var(--chili);color:var(--on-chili);border-end-start-radius:6px}
.bubble.theirs{align-self:flex-end;background:var(--surface);border:1px solid var(--line);border-end-end-radius:6px}
.bubble.sys{align-self:center;background:var(--saf-soft);font-size:.82rem;font-weight:700;border-radius:999px;padding:4px 14px;text-align:center;max-width:94%}
.bubble time{font-size:.7rem;opacity:.75;align-self:flex-end;direction:ltr}
.bubble audio{width:220px;max-width:100%;height:40px}
.quick{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.88rem;font-weight:700;white-space:nowrap}
.composer{display:flex;align-items:center;gap:8px;padding:8px 0;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.composer .inp{border-radius:999px;min-height:46px;padding:8px 16px}
.round{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;flex:none;background:var(--chili);color:var(--on-chili);position:relative;overflow:hidden}
.round.ghost{background:var(--surface);color:var(--chili);border:1.5px solid var(--line)}
.round[disabled]{opacity:.4;cursor:not-allowed}
.round input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;font-size:0}
.inbox-row{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;cursor:pointer}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--saf);color:var(--on-saf);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;flex:none}
.usernote{background:var(--saf-soft);border-inline-start:4px solid var(--chili);border-radius:10px;padding:6px 10px;font-size:.9rem;font-weight:700;margin-top:6px;overflow-wrap:anywhere}
.usernote span{color:var(--chili);font-weight:800}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:700;cursor:pointer}
.sugs button[aria-pressed="true"]{background:var(--chili-soft);border-color:var(--chili);color:var(--chili)}
.charcount{font-size:.78rem;color:var(--muted);align-self:flex-end}
.inbox-row .pv{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

try{document.documentElement.setAttribute('dir','rtl');document.documentElement.setAttribute('lang','ar');}catch(e){}
const {useState,useEffect,useRef}=React;

const CITIES=['الرباط','الدار البيضاء','مراكش','طنجة','فاس','أكادير','مكناس','وجدة','تطوان','القنيطرة'];

const KEY='chhiwat-v2';

/* ---------- seed ---------- */
function seed(){
  const kitchens=[
    {id:'k1',name:'مطبخ الحاجة فاطمة',city:'الرباط'},
    {id:'k2',name:'دار ماما زينب',city:'الدار البيضاء'},

  const d=(id,kitchenId,name,price,kind,lead,clay,featured)=>({id,kitchenId,name,price,kind,lead,clay,featured,available:true,photo:null});

/* ---------- helpers ---------- */
function readPhoto(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();
      img.onload=()=>{const k=Math.min(1,640/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));};
      img.onerror=()=>res(null);img.src=r.result;};
    r.onerror=()=>res(null);r.readAsDataURL(file);
  });
}
function optLabels(o){
  const a=[];if(o.nosugar)a.push('بدون سكر');if(o.nosalt)a.push('بدون ملح');if(o.lowoil)a.push('زيت قليل');a.push('الحرارة: '+SPICE[o.spice||'normal']);return a;
}
function kitchenRating(S,id){
  const rs=S.reviews.filter(r=>r.kitchenId===id);if(!rs.length)return null;
  return {avg:(rs.reduce((a,r)=>a+r.stars,0)/rs.length).toFixed(1),n:rs.length};
}
function cartTotals(S){
  let items=0,dep=0;
  S.cart.lines.forEach(l=>{const d=S.dishes.find(x=>x.id===l.dishId);if(!d)return;items+=d.price*l.qty;if(l.pack==='clay')dep+=DEPOSIT*l.qty;});
  const del=S.cart.lines.length&&S.delivery==='glovo'?DELIVERY:0;
  return {items,dep,del,total:items+dep+del};
}

const QUICK={
  cook:['بدأت التحضير الآن','سيكون الطلب جاهزًا خلال 30 دقيقة','هل تريد تعديلًا على الطبق؟','هل يمكنك تأكيد العنوان؟'],
  client:['هل بدأتم التحضير؟','هل يمكن تقليل الملح؟','أين المندوب؟','شكرًا لكم']
};
let tf=null;
try{tf=new Intl.DateTimeFormat('ar-MA-u-nu-latn',{hour:'2-digit',minute:'2-digit',hour12:false});}catch(e){}
const fmtTime=t=>{if(!t)return '';try{return tf?tf.format(new Date(t)):'';}catch(e){return '';}};
const msgOf=m=>({...m,type:m.type||(m.url?'voice':'text'),at:m.at||0});
const unreadOf=(o,me)=>{const seen=(o.seen&&o.seen[me])||0;return (o.msgs||[]).filter(m=>m.from!==me&&m.from!=='sys'&&(m.at||0)>seen).length;};
const pushMsg=(up,id,msg)=>up(s=>({orders:s.orders.map(x=>x.id===id?{...x,msgs:[...(x.msgs||[]),{id:uid(),at:Date.now(),...msg}]}:x)}));
const markSeen=(up,id,me)=>up(s=>({orders:s.orders.map(x=>x.id===id?{...x,seen:{...(x.seen||{}),[me]:Date.now()}}:x)}));
const preview=o=>{const m=(o.msgs||[]).map(msgOf).slice(-1)[0];if(!m)return 'ابدأ المحادثة';return m.type==='voice'?'رسالة صوتية':m.text;};
const lastAt=o=>{const m=(o.msgs||[]).slice(-1)[0];return (m&&m.at)||o.at||0;};

function Chat({o,me,title,sub,up,onClose}){
  const [text,setText]=useState('');
  const end=useRef(null);
  const msgs=(o.msgs||[]).map(msgOf);
  useEffect(()=>{markSeen(up,o.id,me);},[msgs.length]);
  useEffect(()=>{if(end.current&&end.current.scrollIntoView)end.current.scrollIntoView({block:'end'});},[msgs.length]);
  const send=t=>{const v=(t===undefined?text:t).trim();if(!v)return;pushMsg(up,o.id,{from:me,type:'text',text:v});if(t===undefined)setText('');};
  const onVoice=async e=>{
    const f=e.target.files&&e.target.files[0];e.target.value='';if(!f)return;
    let url=null;
    if(f.size<=700*1024)url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(f);});
    if(!url)url=URL.createObjectURL(f);
    pushMsg(up,o.id,{from:me,type:'voice',url});
  };
  return html`<div className="ov" onClick=${onClose}><div className="sheet chat" role="dialog" aria-label=${'محادثة '+title} onClick=${e=>e.stopPropagation()}>
    <div className="chat-h"><button className="icon-btn" aria-label="رجوع" onClick=${onClose}><${Ic} n="back"/></button>
      <div className="grow"><b>${title}</b><div className="muted small">${sub}</div></div></div>
    <div className="chat-body">
      ${msgs.length===0?html`<p className="muted small" style=${{textAlign:'center',margin:'auto'}}>ابدأ المحادثة بكتابة رسالة أو إرسال رسالة صوتية.</p>`:null}
      ${msgs.map(m=>m.from==='sys'?html`<div key=${m.id} className="bubble sys">${m.text}</div>`
        :html`<div key=${m.id} className=${'bubble '+(m.from===me?'mine':'theirs')}>${m.type==='voice'?html`<audio controls src=${m.url}></audio>`:html`<span>${m.text}</span>`}<time>${fmtTime(m.at)}</time></div>`)}
      <div ref=${end}></div>
    </div>
    <div className="quick">${QUICK[me].map(q=>html`<button key=${q} onClick=${()=>send(q)}>${q}</button>`)}</div>
    <div className="composer">
      <label className="round ghost" title="إرسال رسالة صوتية"><${Ic} n="mic"/><input type="file" accept="audio/*" capture="user" onChange=${onVoice} aria-label="إرسال رسالة صوتية"/></label>
      <input className="inp grow" aria-label="اكتب رسالة" placeholder="اكتب رسالة" value=${text} onInput=${e=>setText(e.target.value)} onKeyDown=${e=>{if(e.key==='Enter')send();}}/>
      <button className="round" aria-label="إرسال" disabled=${!text.trim()} onClick=${()=>send()}><${Ic} n="send" style=${{transform:'scaleX(-1)'}}/></button>
    </div>
  </div></div>`;
}

              <div className="stepper"><button aria-label="إنقاص" onClick=${()=>setQty(l.id,l.qty-1)}><${Ic} n=${l.qty===1?'trash':'minus'}/></button><b className="num">${l.qty}</b><button aria-label="زيادة" onClick=${()=>setQty(l.id,l.qty+1)}><${Ic} n="plus"/></button></div></div></div></div>`;})}</div></div>
      <div className="card"><span className="lbl">طريقة الاستلام</span>
        <div className="opts" role="radiogroup">
          <button role="radio" aria-checked=${S.delivery==='glovo'} className="opt" onClick=${()=>up({delivery:'glovo'})}><span className="dot">${S.delivery==='glovo'?html`<${Ic} n="check"/>`:null}</span><span><b>توصيل Glovo</b><br/><span className="muted small num">${money(DELIVERY)} داخل المدينة</span></span></button>
          <button role="radio" aria-checked=${S.delivery==='pickup'} className="opt" onClick=${()=>up({delivery:'pickup'})}><span className="dot">${S.delivery==='pickup'?html`<${Ic} n="check"/>`:null}</span><span><b>استلام من المطبخ</b><br/><span className="muted small">بدون رسوم</span></span></button></div>
        ${S.delivery==='glovo'?html`<div className="field"><label htmlFor="ad">عنوان التوصيل</label><textarea id="ad" className="inp" placeholder="الحي، الشارع، رقم المنزل" value=${S.address} onInput=${e=>up({address:e.target.value})}></textarea></div>`:null}
        <div className="note">الدفع عند الاستلام: تدفع المبلغ عند وصول طلبك.</div></div>
      <div className="card sum num">
        <div className="r"><span>الأطباق</span><span>${money(T.items)}</span></div>
        ${T.dep?html`<div className="r"><span>ضمانة الأواني (قابلة للاسترداد)</span><span>${money(T.dep)}</span></div>`:null}
        <div className="r"><span>${S.delivery==='glovo'?'التوصيل':'الاستلام'}</span><span>${money(T.del)}</span></div>
        <div className="r tot"><span>المجموع</span><span>${money(T.total)}</span></div></div>
      <button className="btn big" disabled=${!canPlace} onClick=${place}><${Ic} n="check"/> تأكيد الطلب</button>
      ${!canPlace&&S.delivery==='glovo'?html`<p className="muted small">اكتب عنوان التوصيل لنتمكن من إيصال الطلب.</p>`:null}`):null}

    ${tab==='orders'?(mine.length===0?html`<div className="empty"><${Doodles} className="dd" /><${Ic} n="list" style=${{width:'2.5em',height:'2.5em'}}/><b>لا توجد طلبات</b><span className="small">ستظهر طلباتك هنا بعد تأكيدها.</span></div>`:mine.map(o=>html`<${BuyerOrder} key=${o.id} o=${o} S=${S} up=${up} flash=${flash} onChat=${setChatId}/>`)):null}

    ${tab==='chats'?html`<${Inbox} orders=${mine} me="client" nameOf=${o=>(kitchenOf(o.kitchenId)||{name:'مطبخ'}).name} onOpen=${setChatId}/>`:null}
    </main>

    ${tab==='menu'&&qtyAll?html`<div className="fab"><button className="btn" onClick=${()=>setTab('cart')}><span className="row"><${Ic} n="cart"/> عرض السلة (<span className="num">${qtyAll}</span>)</span><span className="num">${money(T.total)}</span></button></div>`:null}

    <nav className="nav" aria-label="القائمة الرئيسية"><div className="in">
      <button className="tab" aria-current=${tab==='menu'?'page':null} onClick=${()=>setTab('menu')}><${Ic} n="home"/>الرئيسية</button>
      <button className="tab" aria-current=${tab==='cart'?'page':null} onClick=${()=>setTab('cart')}><${Ic} n="cart"/>السلة${qtyAll?html`<span className="badge num">${qtyAll}</span>`:null}</button>
      <button className="tab" aria-current=${tab==='orders'?'page':null} onClick=${()=>setTab('orders')}><${Ic} n="list"/>طلباتي</button>
      <button className="tab" aria-current=${tab==='chats'?'page':null} onClick=${()=>setTab('chats')}><${Ic} n="msg"/>المحادثات${unreadAll?html`<span className="badge num">${unreadAll}</span>`:null}</button>
    </div></nav>

    ${chatO?html`<${Chat} o=${chatO} me="client" title=${(kitchenOf(chatO.kitchenId)||{name:'مطبخ'}).name} sub=${'طلب #'+chatO.no} up=${up} onClose=${()=>setChatId(null)}/>`:null}
    ${pick?html`<${Custom} dish=${pick} onAdd=${o=>addLine(pick,o)} onClose=${()=>setPick(null)}/>`:null}
    ${added?html`<${Sheet} onClose=${()=>setAdded(false)} title="تمت الإضافة">
      <div className="row"><span style=${{width:44,height:44,borderRadius:14,background:'var(--chili)',color:'var(--on-chili)',display:'grid',placeItems:'center'}}><${Ic} n="check"/></span><h3>تمت الإضافة إلى السلة</h3></div>
      <button className="btn big" onClick=${()=>{setAdded(false);setTab('cart');}}><${Ic} n="cart"/> الانتقال إلى السلة والدفع</button>
      <button className="btn ghost big" onClick=${()=>setAdded(false)}>متابعة التصفح</button><//>`:null}
    ${conflict?html`<${Sheet} mid=${true} onClose=${()=>setConflict(null)} title="مطبخ آخر">
      <h3>السلة تحتوي أطباقًا من مطبخ آخر</h3>
      <p className="muted">يقتصر كل طلب على مطبخ واحد لتسهيل التحضير والتوصيل. هل تريد إفراغ السلة والبدء من هذا المطبخ؟</p>
      <button className="btn" onClick=${()=>{up({cart:{kitchenId:conflict.dish.kitchenId,lines:[conflict.line]}});setConflict(null);setAdded(true);}}>إفراغ السلة وإضافة الطبق</button>
      <button className="btn ghost" onClick=${()=>setConflict(null)}>الإبقاء على السلة</button><//>`:null}
    <${Toast} msg=${msg}/>
  </div>`;
}

/* ---------- cook ---------- */
function CookOrder({o,S,up,onChat}){
  const next={new:['قبول وبدء الطهي','cook','cooking'],cooking:[o.delivery==='pickup'?'جاهز للاستلام':'خرج للتوصيل','blue','out'],out:['تم التسليم','violet','done']}[o.status];
  const sysText=next?{cooking:'قبلت الطاهية طلبك وبدأت التحضير',out:o.delivery==='pickup'?'طلبك جاهز للاستلام من المطبخ':'خرج طلبك للتوصيل مع مندوب Glovo',done:'تم تسليم الطلب. بالصحة والهناء!'}[next[2]]:'';
  const step=()=>up(s=>({orders:s.orders.map(x=>x.id===o.id?{...x,status:next[2],msgs:[...(x.msgs||[]),{id:uid(),from:'sys',type:'sys',text:sysText,at:Date.now()}]}:x)}));
  const label=o.status==='out'&&o.delivery==='pickup'?STATUS_LABEL.outPickup:STATUS_LABEL[o.status];
  const cookLabel={new:'طلب جديد',cooking:'قيد التحضير',out:o.delivery==='pickup'?'جاهز للاستلام':'في الطريق',done:'تم التسليم'}[o.status];
  return html`<article className="card">
    <div className="row" style=${{justifyContent:'space-between'}}><span className=${'status st-'+o.status}>${cookLabel}</span><span className="muted small num">#${o.no}</span></div>
    <${OrderItems} o=${o}/>
    <div className="row wrap"><span className="chip line">${o.delivery==='glovo'?'توصيل Glovo':'يستلمه الزبون من عندك'}</span>
      ${o.dep?html`<span className="chip saf">ضمانة <span className="num">${o.dep}</span> د.م</span>`:null}
      <span className="chip line num">${money(o.total)} عند التسليم</span></div>
    ${o.address?html`<p className="small muted"><${Ic} n="pin"/> ${o.address}</p>`:null}
    ${next?html`<button className=${'btn big '+next[1]} onClick=${step}><${Ic} n="check"/> ${next[0]}</button>`:null}
    ${o.status==='done'&&o.dep?html`<button className=${'btn sm '+(o.depositReturned?'ghost':'saf')} onClick=${()=>up(s=>({orders:s.orders.map(x=>x.id===o.id?{...x,depositReturned:!x.depositReturned}:x)}))}>${o.depositReturned?'تم إرجاع الضمانة للزبون':'استلمتُ الأواني وأرجعتُ الضمانة'}</button>`:null}
    <${ChatButton} o=${o} me="cook" onChat=${onChat}/>
  </article>`;
}

function CookDishForm({kid,up,onClose}){
  const [f,setF]=useState({name:'',price:'',lead:'60',kind:'tagine',clay:false,photo:null});
  const set=p=>setF(x=>({...x,...p}));
  const pickPhoto=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;const p=await readPhoto(file);if(p)set({photo:p});e.target.value='';};
  const ok=f.name.trim().length>1&&Number(f.price)>0;
  const add=()=>{
    up(s=>({dishes:[...s.dishes,{id:'d'+uid(),kitchenId:kid,name:f.name.trim(),price:Math.round(Number(f.price)),kind:f.kind,lead:Math.max(5,Number(f.lead)||60),clay:f.clay,featured:false,available:true,photo:f.photo}]}));
    onClose();
  };
  return html`<${Sheet} onClose=${onClose} title="طبق جديد">
    <h3>طبق جديد</h3>
    <div className="field"><span className="lbl">صورة الطبق</span>
      <div className="photo-prev">${f.photo?html`<img src=${f.photo} alt="صورة الطبق"/>`:html`<${Ic} n="camera" style=${{width:'2.4em',height:'2.4em'}}/>`}</div>
      <div className="row wrap">
        <label className="btn sm filebtn"><${Ic} n="camera"/> التقاط بالكاميرا<input type="file" accept="image/*" capture="environment" onChange=${pickPhoto} aria-label="التقاط بالكاميرا"/></label>
        <label className="btn ghost sm filebtn"><${Ic} n="image"/> من المعرض<input type="file" accept="image/*" onChange=${pickPhoto} aria-label="اختيار من المعرض"/></label></div></div>
    <div className="field"><label htmlFor="dn">اسم الطبق</label><input id="dn" className="inp" value=${f.name} onInput=${e=>set({name:e.target.value})} placeholder="مثال: طاجين بالبرقوق"/></div>
    <div className="row"><div className="field grow"><label htmlFor="dp">السعر (د.م)</label><input id="dp" className="inp ltr" inputMode="numeric" value=${f.price} onInput=${e=>set({price:e.target.value.replace(/\D/g,'')})}/></div>
      <div className="field grow"><label htmlFor="dl">وقت التحضير (دقيقة)</label><input id="dl" className="inp ltr" inputMode="numeric" value=${f.lead} onInput=${e=>set({lead:e.target.value.replace(/\D/g,'')})}/></div></div>
    <div className="field"><label htmlFor="dk">النوع</label><select id="dk" className="inp" value=${f.kind} onChange=${e=>set({kind:e.target.value})}>${KINDS.map(([k,v])=>html`<option key=${k} value=${k}>${v}</option>`)}</select></div>
    <button className="opt sq" aria-pressed=${f.clay} onClick=${()=>set({clay:!f.clay})}><span className="dot">${f.clay?html`<${Ic} n="check"/>`:null}</span>يمكن تقديمه في طاجين فخار / قصعة (ضمانة ${DEPOSIT} د.م)</button>
    <button className="btn big" disabled=${!ok} onClick=${add}><${Ic} n="plus"/> إضافة إلى القائمة</button>
  <//>`;
}

function Cook({S,up}){
  const [tab,setTab]=useState('orders');
  const [form,setForm]=useState(false);
  const [del,setDel]=useState(null);
  const [replying,setReplying]=useState({});
  const [chatId,setChatId]=useState(null);
  const [msg,setMsg]=useState('');
  const flash=t=>{setMsg(t);setTimeout(()=>setMsg(''),2200);};
  const k=S.kitchens.find(x=>x.id===S.kitchenId);
  if(!k)return null;
  const orders=S.orders.filter(o=>o.kitchenId===k.id).sort((a,b)=>b.at-a.at);
  const dishes=S.dishes.filter(d=>d.kitchenId===k.id);
  const reviews=S.reviews.filter(r=>r.kitchenId===k.id).slice().reverse();
  const r=kitchenRating(S,k.id);
  const groups=[['new','طلبات جديدة','var(--st-new)'],['cooking','قيد التحضير','var(--st-cook)'],['out','في الطريق','var(--st-out)'],['done','مكتملة','var(--st-done)']];
  const newCount=orders.filter(o=>o.status==='new').length;
  const unreadAll=orders.reduce((a,o)=>a+unreadOf(o,'cook'),0);
  const chatO=S.orders.find(o=>o.id===chatId);
  const demo=()=>{
    const pool=dishes.filter(d=>d.available);if(!pool.length){flash('أضف طبقًا إلى القائمة أولًا');return;}
    const d=pool[Math.floor(Math.random()*pool.length)];
    const clay=d.clay&&Math.random()>.4;
    const l={id:uid(),dishId:d.id,dish:d,qty:1+Math.floor(Math.random()*2),nosugar:false,nosalt:Math.random()>.6,lowoil:Math.random()>.5,spice:['normal','mild','hot'][Math.floor(Math.random()*3)],pack:clay?'clay':'box',note:Math.random()>.4?'بدون بصل، والصلصة على جنب':''};
    const items=d.price*l.qty,dep=clay?DEPOSIT*l.qty:0;
    const delivery=Math.random()>.3?'glovo':'pickup';const dl=delivery==='glovo'?DELIVERY:0;
    const o={id:uid(),no:S.seq+1,kitchenId:k.id,phone:'0600000000',client:'زبون تجريبي',lines:[l],items,dep,del:dl,total:items+dep+dl,delivery,address:delivery==='glovo'?'حي أكدال، شارع 12، رقم 4':'',status:'new',at:Date.now(),msgs:[{id:uid(),from:'sys',type:'sys',text:'وصل طلب جديد',at:Date.now()-1000},{id:uid(),from:'client',type:'text',text:'السلام عليكم، هل يمكن تقليل الملح قليلًا؟',at:Date.now()}],seen:{},depositReturned:false,reviewed:false};
    up(s=>({orders:[o,...s.orders],seq:s.seq+1}));flash('وصل طلب تجريبي');
  };
  const upd=(id,p)=>up(s=>({dishes:s.dishes.map(d=>d.id===id?{...d,...p}:d)}));

  return html`<div>
    <${Header} S=${S} up=${up} showCity=${false}/>
    <main className="page">
      <section className="banner" style=${{background:'#D9381E',color:'#FFF4E4',cursor:'default',minHeight:'130px'}}>
        <${Doodles} className="dd"/>
        <span className="tag" style=${{background:'#F4A81D',color:'#2B1710'}}>${k.name}</span>
        <h2 style=${{fontSize:'1.45rem',maxWidth:'100%'}}>الله يعطيك الصحة مولات الكوزينة!</h2>
        <p style=${{maxWidth:'100%'}}>${newCount?'عندك '+newCount+' طلبات جداد كيتسناو':'شوفي الطلبات وبداو الطيب'}</p>
      </section>
      <div className="muted small row" style=${{gap:'6px'}}><${Ic} n="pin"/> ${k.city}${r?html` · <span className="star">★</span> <span className="num">${r.avg}</span> <span className="num">(${r.n})</span>`:''}</div>

      ${tab==='orders'?html`
        <button className="btn saf" onClick=${demo}><${Ic} n="plus"/> طلب تجريبي</button>
        ${orders.length===0?html`<div className="empty"><${Doodles} className="dd" /><${Ic} n="list" style=${{width:'2.5em',height:'2.5em'}}/><b>لا توجد طلبات حاليًا</b><span className="small">عند وصول طلب سيظهر هنا. يمكنك تجربة طلب تجريبي.</span></div>`:null}
        ${groups.map(([st,title,col])=>{const g=orders.filter(o=>o.status===st);if(!g.length)return null;return html`<section key=${st} className="stack">
          <div className="kanban-h"><i style=${{background:col}}></i><h2>${title}</h2><span className="chip num">${g.length}</span></div>
          ${g.map(o=>html`<${CookOrder} key=${o.id} o=${o} S=${S} up=${up} onChat=${setChatId}/>`)}</section>`;})}`:null}

      ${tab==='chats'?html`<${Inbox} orders=${orders} me="cook" nameOf=${o=>o.client||'زبون'} onOpen=${setChatId}/>`:null}

      ${tab==='menu'?html`
        <button className="btn" onClick=${()=>setForm(true)}><${Ic} n="plus"/> طبق جديد</button>
        ${dishes.length===0?html`<div className="empty"><${Doodles} className="dd" /><b>القائمة فارغة</b><span className="small">أضف أول طبق والتقط له صورة.</span></div>`:null}
        ${dishes.map(d=>html`<article key=${d.id} className="card">
          <div className="row"><${Thumb} dish=${d} lg=${true}/><div className="grow"><b>${d.name}</b><div className="price num">${money(d.price)}</div>
            <div className="row wrap" style=${{gap:'6px'}}>${d.featured?html`<span className="tag red">شهية اليوم</span>`:null}${!d.available?html`<span className="chip line">مخفي</span>`:null}${d.clay?html`<span className="chip">فخار</span>`:null}</div></div></div>
          <div className="row wrap">
            <button className=${'btn sm '+(d.featured?'saf':'ghost')} onClick=${()=>upd(d.id,{featured:!d.featured})}><${Ic} n="star" fill=${d.featured}/> طبق اليوم</button>
            <button className="btn sm ghost" onClick=${()=>upd(d.id,{available:!d.available})}>${d.available?'إخفاء':'إظهار'}</button>
            ${del===d.id?html`<button className="btn sm" onClick=${()=>{up(s=>({dishes:s.dishes.filter(x=>x.id!==d.id),cart:s.cart.lines.some(l=>l.dishId===d.id)?{kitchenId:null,lines:[]}:s.cart}));setDel(null);}}>تأكيد الحذف</button><button className="btn sm ghost" onClick=${()=>setDel(null)}>إلغاء</button>`
              :html`<button className="btn sm ghost" onClick=${()=>setDel(d.id)}><${Ic} n="trash"/> حذف</button>`}
          </div></article>`)}`:null}

      ${tab==='reviews'?html`
        ${reviews.length===0?html`<div className="empty"><${Doodles} className="dd" /><${Ic} n="star" style=${{width:'2.5em',height:'2.5em'}}/><b>لا توجد تقييمات بعد</b><span className="small">ستظهر تقييمات الزبائن هنا.</span></div>`:null}
        ${reviews.map(rv=>html`<article key=${rv.id} className="card">
          <div className="row" style=${{justifyContent:'space-between'}}><b>${rv.who}</b><${Stars} n=${rv.stars}/></div>
          ${rv.text?html`<p>${rv.text}</p>`:null}
          ${rv.reply?html`<div className="reply"><b className="small">ردّك:</b> ${rv.reply}</div>`
            :html`<div className="row"><input className="inp grow" aria-label="اكتب ردًا" placeholder="اكتب ردًا على التعليق" value=${replying[rv.id]||''} onInput=${e=>setReplying({...replying,[rv.id]:e.target.value})}/>
              <button className="btn sm" disabled=${!(replying[rv.id]||'').trim()} onClick=${()=>{up(s=>({reviews:s.reviews.map(x=>x.id===rv.id?{...x,reply:replying[rv.id].trim()}:x)}));}}>إرسال</button></div>`}
        </article>`)}`:null}
    </main>
    <nav className="nav" aria-label="القائمة الرئيسية"><div className="in">
      <button className="tab" aria-current=${tab==='orders'?'page':null} onClick=${()=>setTab('orders')}><${Ic} n="list"/>الطلبات${newCount?html`<span className="badge num">${newCount}</span>`:null}</button>
      <button className="tab" aria-current=${tab==='menu'?'page':null} onClick=${()=>setTab('menu')}><${Ic} n="book"/>القائمة</button>
      <button className="tab" aria-current=${tab==='chats'?'page':null} onClick=${()=>setTab('chats')}><${Ic} n="msg"/>المحادثات${unreadAll?html`<span className="badge num">${unreadAll}</span>`:null}</button>
      <button className="tab" aria-current=${tab==='reviews'?'page':null} onClick=${()=>setTab('reviews')}><${Ic} n="star"/>التقييمات</button>
    </div></nav>
    ${chatO?html`<${Chat} o=${chatO} me="cook" title=${chatO.client||'زبون'} sub=${'طلب #'+chatO.no} up=${up} onClose=${()=>setChatId(null)}/>`:null}
    ${form?html`<${CookDishForm} kid=${k.id} up=${up} onClose=${()=>setForm(false)}/>`:null}
    <${Toast} msg=${msg}/>
  </div>`;
}

/* ---------- root ---------- */
function App(){
  const [S,setS]=useState(load);
  const up=p=>setS(s=>({...s,...(typeof p==='function'?p(s):p)}));
  useEffect(()=>{save(S);},[S]);
  const a=S.auth;
  if(!a.role)return html`<${Welcome} up=${up}/>`;
  if(!a.verified)return html`<${Login} S=${S} up=${up}/>`;
  if(a.role==='cook'){
    if(!S.kitchenId||!S.kitchens.find(k=>k.id===S.kitchenId))return html`<${CookSetup} S=${S} up=${up}/>`;
    return html`<${Cook} S=${S} up=${up}/>`;
  }
  return html`<${Buyer} S=${S} up=${up}/>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
